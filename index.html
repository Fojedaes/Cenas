<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenas de la semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cenas">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EDE6; --line:#D3DBD1;
  --text:#1D2A23; --muted:#56655C; --primary:#2C5E46; --primary-ink:#FFFFFF; --focus:#1F7A55;
  --warn:#9A5B00; --warn-bg:#FFF1D6; --ok:#2C6B3F; --ok-bg:#E1F1E3; --danger:#A3352B;
  --cB:#4C7BAA; --cA:#1C5986; --cP:#B37A12; --cC:#A3402C; --cV:#4A8239; --leg:#7E5F33;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 6px 18px rgba(20,40,30,.06);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111714; --surface:#19211D; --surface-2:#222C27; --line:#2F3B35;
    --text:#E4EBE6; --muted:#9DAEA4; --primary:#7CC4A0; --primary-ink:#0E1A14; --focus:#9BE0BD;
    --warn:#F2BC63; --warn-bg:#3A2E17; --ok:#8FD3A4; --ok-bg:#1D3326; --danger:#F08A7E;
    --cB:#7FA9D6; --cA:#5E9FD1; --cP:#E0AE4C; --cC:#E07E66; --cV:#87C06F; --leg:#C79C62;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111714; --surface:#19211D; --surface-2:#222C27; --line:#2F3B35;
  --text:#E4EBE6; --muted:#9DAEA4; --primary:#7CC4A0; --primary-ink:#0E1A14; --focus:#9BE0BD;
  --warn:#F2BC63; --warn-bg:#3A2E17; --ok:#8FD3A4; --ok-bg:#1D3326; --danger:#F08A7E;
  --cB:#7FA9D6; --cA:#5E9FD1; --cP:#E0AE4C; --cC:#E07E66; --cV:#87C06F; --leg:#C79C62;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 150px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabecera de semana */
.weekhead{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.weekhead h1{flex:1;font-size:1.5rem}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:14px}
.linkbtn{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* Resumen de equilibrio */
.balance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin-bottom:16px}
.bar{display:flex;gap:3px;margin:2px 0 12px}
.bar span{flex:1;font-size:.72rem;color:var(--muted);text-align:center}
.bar span::before{content:"";display:block;height:10px;border-radius:5px;background:var(--seg);margin-bottom:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.85rem;background:var(--surface-2);line-height:1.3}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.avg{margin-top:8px;font-size:.9rem;color:var(--muted)}

/* Tarjetas de día */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:62px 1fr;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.day.today{border-color:var(--primary);border-width:2px}
.date{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 0;border-right:4px solid var(--c);background:color-mix(in srgb, var(--c) 9%, transparent)}
.date b{font-family:var(--f-display);font-size:1.85rem;font-weight:800;line-height:1}
.date span{font-size:.8rem;color:var(--muted);text-transform:lowercase}
.hoy{color:var(--primary)}
.daybody{padding:12px 12px 10px 14px;min-width:0}
.dayname{display:block;width:100%;text-align:left}
.dayname h3{font-size:1.08rem;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:var(--muted);align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;margin-right:4px;vertical-align:1px}
.legtag{color:var(--leg);font-weight:700}
.dayfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.who{display:flex;gap:6px}
.chip{min-height:36px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);font-size:.875rem;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chip[aria-pressed="true"]{background:color-mix(in srgb, var(--primary) 14%, var(--surface));border-color:color-mix(in srgb, var(--primary) 45%, var(--surface));color:var(--text);font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted)}
.who .chip[aria-pressed="false"]{text-decoration:line-through;border-style:dashed}
.chip svg{width:14px;height:14px}
.btn{min-height:44px;padding:0 14px;white-space:nowrap;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.small{min-height:36px;padding:0 10px;font-size:.9rem;border-radius:10px}
.btn.full{width:100%}
.btn svg{width:18px;height:18px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.actions .btn{width:100%}
@media (min-width:520px){.actions{flex-direction:row}.actions .btn{flex:1}}
.nobody{font-size:.85rem;color:var(--warn)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:.78rem;color:var(--muted);min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}

/* Lista de la compra */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 0 12px}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--primary);transition:width .2s}
.aisle{margin-bottom:18px}
.aisle h2{font-size:1.05rem;margin:0 0 6px;color:var(--muted);font-weight:700}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.item[aria-checked="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.item[aria-checked="true"] .iname{text-decoration:line-through;color:var(--muted)}
.box svg{width:16px;height:16px}
.iname{font-weight:700}
.iqty{font-size:.9rem}
.idet{font-size:.8rem;color:var(--muted)}
.casa summary{cursor:pointer;font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:1.05rem;min-height:40px;display:flex;align-items:center}
.casa ul{margin:4px 0 0;padding:12px 14px 12px 32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.casa li{margin:2px 0}

/* Recetas */
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;margin:8px 0 10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;text-align:left;width:100%;border-left:5px solid var(--c)}
.rrow .t{flex:1;min-width:0}
.rrow h3{font-size:1rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Hojas superpuestas */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheethead{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheethead h2{flex:1;font-size:1.05rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetbody .wrap{padding-bottom:160px}
.rhero{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin:8px 0 14px}
.rhero h1{font-size:1.6rem;margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fact b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.fact span{font-size:.8rem;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.section{margin:22px 0 10px}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings .q{text-align:right;flex:none;max-width:48%}
.ings .q small{display:block;color:var(--muted);font-size:.78rem}
.extra{font-size:.9rem;color:var(--muted);margin-top:8px}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.step .n{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center;font-weight:700;color:var(--primary);font-family:var(--f-display)}
.step.done{opacity:.55}
.step.done .n{background:var(--primary);color:var(--primary-ink)}
.step p{margin:0}
.big .step p{font-size:1.15rem;line-height:1.55}
.stepact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.note{background:var(--warn-bg);color:var(--text);border-radius:var(--r-m);padding:12px 14px;margin-top:12px;font-size:.92rem}
.note b{color:var(--warn)}
.tip{background:var(--surface-2);border-radius:var(--r-m);padding:12px 14px;margin-top:10px;font-size:.92rem}
.nutwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.nut{width:100%;border-collapse:collapse;font-size:.88rem}
table.nut th{font-weight:700;color:var(--muted);font-size:.8rem}
table.nut th,table.nut td{padding:8px 8px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
table.nut th:first-child,table.nut td:first-child{text-align:left}
table.nut tr:last-child td{border-bottom:0}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Cambiar plato */
.alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;border-left:5px solid var(--c)}
.alt .t{flex:1}
.alt .why{font-size:.8rem;color:var(--warn);margin-top:2px}
.alt .good{font-size:.8rem;color:var(--ok);margin-top:2px}

.ovw{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.ovh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);margin-bottom:6px}
.ovl{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.ovl .dot{background:var(--c)}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.swrow{width:100%;text-align:left;padding:6px 0;min-height:56px}
.swrow[aria-checked="true"] .switch{background:var(--primary)}
.swrow[aria-checked="true"] .switch::after{transform:translateX(22px)}
.prose p{margin:.5em 0}
.prose ul{padding-left:1.2em;margin:.4em 0}

/* Temporizadores */
.timers{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;pointer-events:none}
.timers .in{max-width:720px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;gap:6px}
.timer{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .lbl{flex:1;font-size:.85rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tm{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.timer button{min-width:40px;min-height:40px;border-radius:10px;display:grid;place-items:center}
.timer button svg{width:18px;height:18px}
.timer.ring{background:var(--primary);color:var(--primary-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:.9rem;max-width:90vw}
.copybox{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px;font:inherit;font-size:.9rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.facts{grid-template-columns:repeat(3,160px)}}
:root{--cleg:var(--leg)}

/* ---- v2 ---- */
.day.na{background:var(--surface-2);box-shadow:none}
.day.na .date{background:transparent;border-right-color:var(--line)}
.day.tbd{border-style:dashed}
.day.tbd .date{border-right-color:var(--line)}
.kicker{font-size:.8rem;color:var(--muted);margin:0 0 2px}
.natitle{font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:.78rem;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.slots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pickgroup{margin:14px 0 4px;font-size:.85rem;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-height:38px}
.chip.sel{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin:10px 0}
.preview h3{font-size:1.1rem;margin-bottom:4px}
.sheetfoot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:3}
.sheetfoot .in{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;width:100%}
.check .box{flex:none}
.check[aria-checked="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.field{display:block;margin:12px 0}
.field > span{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.field input,.field textarea,.field select,.ingrow input,.ingrow select{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:8px 10px;font:inherit}
.field textarea{min-height:120px;resize:vertical}
.ingrow{display:grid;grid-template-columns:1fr 70px 70px 40px;gap:6px;align-items:center;margin-bottom:6px}
.ingrow .aisle{grid-column:1 / -1}
.ingrow .aisle[hidden]{display:none}
.inghead{display:grid;grid-template-columns:1fr 70px 70px 40px;gap:6px;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--ok-bg);color:var(--text);border-radius:var(--r-m);padding:10px 14px;margin:8px 0;font-size:.9rem}
.banner.warn{background:var(--warn-bg)}
.errtxt{color:var(--danger);font-size:.9rem;margin-top:6px}
.timeline{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.timeline li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline b.min{font-family:var(--f-display)}
.comphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 8px}
.comphead h3{font-size:1.05rem}
.rotlist{list-style:none;margin:8px 0 0;padding:0}
.rotlist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.miniseg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.ovday{display:grid;grid-template-columns:34px 1fr;gap:6px}

    }
  }
  if (raw.plan && typeof raw.plan === 'object'){

  }
  if (raw.checked && typeof raw.checked === 'object') for (const [k, v] of Object.entries(raw.checked)) if (v && typeof v === 'object') st.checked[k] = v;
  if (raw.diners && typeof raw.diners === 'object') for (const [k, v] of Object.entries(raw.diners)) if (Array.isArray(v) && v.length === 2) st.diners[k] = [!!v[0], !!v[1]];

}
function num(x){ const n = Number(x); return isFinite(n) && n >= 0 ? n : 0; }
const AISLE_IDS = AISLES.map(a => a[0]);

  return c && typeof c === 'object' && typeof c.id === 'string' && ['p','v','h','d'].includes(c.kind) && typeof c.name === 'string' && c.name.trim()
    && Array.isArray(c.ing) && c.ing.length && c.ing.every(r => Array.isArray(r) && (ING[r[0]] || ingMap[r[0]]) && r[1] >= 0 && r[2] >= 0)
    && Array.isArray(c.steps) && c.steps.every(s => Array.isArray(s) && typeof s[0] === 'string');
}
function save(){
  const ks = Object.keys(S.checked).sort(); while (ks.length > 30) delete S.checked[ks.shift()];

}
const comp = id => id ? (CBASE[id] || S.custom.comps[id] || null) : null;

const allComps = () => [...COMPS, ...Object.values(S.custom.comps)];

/* ---------- Fechas ---------- */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

const weekDates = k => [0,1,2,3,4,5,6].map(i => addDays(parseYmd(k), i));
function weekTitle(k){
  const d = weekDates(k), a = d[0], b = d[6];
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} de ${MONTHS[b.getMonth()]}` : `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]}`;
}
const weeksSince = k => Math.round((parseYmd(k) - parseYmd(ANCHOR_MONDAY)) / (7 * 86400000));
function relWeek(k){
  const n = Math.round((parseYmd(k) - parseYmd(curMonday())) / (7 * 86400000));
  return n === 0 ? 'Esta semana' : n === 1 ? 'La semana que viene' : n === -1 ? 'La semana pasada' : n > 1 ? `Dentro de ${n} semanas` : `Hace ${-n} semanas`;
}

/* ---------- Plan ---------- */
function itemValid(t, it){ return t.mode === 'dish' ? !!comp(it.d) && comp(it.d).kind === 'd' : !!(comp(it.p) || comp(it.v) || comp(it.h)); }
function templateEntry(dk){
  const wd = (parseYmd(dk).getDay() + 6) % 7; const t = S.template[wd] || { mode: 'tbd', note: '', list: [] };
  if (t.mode === 'na') return { type: 'na', note: t.note || '', auto: true };
  if (t.mode === 'tbd') return { type: 'tbd', note: t.note || '', auto: true };
  const list = t.list.filter(it => itemValid(t, it));
  if (!list.length) return { type: 'tbd', note: '', auto: true };
  const n = weeksSince(ymd(mondayOf(parseYmd(dk))));
  const it = list[((n % list.length) + list.length) % list.length];
  return t.mode === 'dish' ? { type: 'dish', d: it.d, auto: true } : { type: 'combo', p: it.p || null, v: it.v || null, h: it.h || null, auto: true };
}
function entryFor(dk){
  const e = S.plan[dk];
  if (e){
    if (e.type === 'combo' && !(comp(e.p) || comp(e.v) || comp(e.h))) return { type: 'tbd', note: 'El plato elegido se ha borrado', missing: true };
    if (e.type === 'dish' && !comp(e.d)) return { type: 'tbd', note: 'El plato elegido se ha borrado', missing: true };

}
const cookable = e => e.type === 'combo' || e.type === 'dish';
function entryComps(e){ return e.type === 'dish' ? [comp(e.d)].filter(Boolean) : e.type === 'combo' ? [comp(e.p), comp(e.v), comp(e.h)].filter(Boolean) : []; }
function lc(s){ return s.charAt(0).toLowerCase() + s.slice(1); }
function labelOf(c){ return c.label || lc(c.name); }
function entryTitle(e){
  if (e.type === 'dish') return comp(e.d) ? comp(e.d).name : 'Plato borrado';
  if (e.type === 'na') return 'No cenamos en casa';
  if (e.type === 'tbd') return 'Por decidir';
  const p = comp(e.p), v = comp(e.v), h = comp(e.h);
  const rest = [v, h].filter(Boolean).map(labelOf);
  const head = p ? p.name : v ? v.name : h ? h.name : '';
  const tail = p ? rest : (v ? [h].filter(Boolean).map(labelOf) : []);
  return head + (tail.length ? ' con ' + tail.join(' y ') : '');
}
function diners(dk){ return S.diners[dk] || [true, true]; }

/* ---------- Nutrición ---------- */
function compNut(c, who){
  if (c.nut && c.nut[who]) return { k: num(c.nut[who].k), p: num(c.nut[who].p), f: null, c: null, manual: true };
  const t = { k: 0, p: 0, f: 0, c: 0 };
  for (const [key, F, J] of c.ing){ const i = ingOf(key); if (!i || i.unknown) return null; const g = who === 'F' ? F : J; t.k += i.k*g/100; t.p += i.p*g/100; t.f += i.f*g/100; t.c += i.c*g/100; }
  return t;
}
function entryNut(e, who){
  const cs = entryComps(e); if (!cs.length) return null;
  const t = { k: 0, p: 0, f: 0, c: 0 };
  for (const c of cs){ const n = compNut(c, who); if (!n) return null; t.k += n.k; t.p += n.p; if (n.f == null || t.f == null){ t.f = null; t.c = null; } else { t.f += n.f; t.c += n.c; } }
  return t;
}
function franFlag(n){
  if (!n) return null;
  const T = TARGETS.F;
  if (n.k > T.kcal[1] + 80) return { cls: 'warn', t: 'Por encima de tu cena objetivo' };
  if (n.p < T.prot - 4) return { cls: 'warn', t: 'Poca proteína para tu plan' };
  if (n.k < T.kcal[0] - 60) return { cls: 'warn', t: 'Cena ligera: puedes añadir hidrato' };
  return { cls: 'ok', t: 'Dentro de tu plan' };
}

/* ---------- Lista de la compra ---------- */
function frac(x){ const q = Math.ceil(x*4 - 1e-9)/4, w = Math.floor(q), r = q - w; return ((w ? String(w) : '') + (r === .25 ? '¼' : r === .5 ? '½' : r === .75 ? '¾' : '')) || '0'; }

const round10 = g => Math.ceil(g/10 - 1e-9)*10;

function buyText(key, g){
  const i = ingOf(key);

  if (key === 'perejil') return { q: 'un poco', d: '' };

  const gq = i.ml ? `${Math.round(g)} ml` : gtxt(round10(g));
  if (u.pack){ const n = Math.max(1, Math.ceil(g/u.g - 0.02)); const left = n*u.g - g; return { q: `${n} ${n === 1 ? u.s : u.pl}`, d: `Necesitas ${gq}${sfx}` + (left >= u.g*0.3 ? `; sobran unos ${i.ml ? Math.floor(left/10)*10 + ' ml' : gtxt(Math.floor(left/10)*10)}` : '') }; }
  if (u.frac){ const x = g/u.g; const one = Math.ceil(x*4 - 1e-9)/4 <= 1; return { q: `${frac(x)} ${one ? u.s : u.pl}`, d: `Necesitas unos ${gq}${sfx}` }; }
  const x = Math.max(.5, halfUp(g/u.g)); return { q: `${numTxt(x)} ${x <= 1 ? u.s : u.pl}`, d: `Necesitas unos ${gq}${sfx}` };

  const items = {}, spices = new Set(); let persons = 0;
  weekDates(wk).forEach((dt, d) => {
    const dk = ymd(dt), e = entryFor(dk); if (!cookable(e)) return;
    const [f, j] = diners(dk); if (!f && !j) return;

      (c.spices || []).forEach(s => SPICES[s] && spices.add(s));

}

function renderShop(){

  const groups = {}; sh.items.forEach(it => { const a = ingOf(it.key).a; (groups[a] = groups[a] || []).push(it); });
  const buyA = AISLES.filter(([a]) => a !== 'casa' && groups[a]); const all = buyA.flatMap(([a]) => groups[a]);
  if (!all.length) return `${weekNav()}<div class="empty">Esta semana no hay cenas en casa planificadas. Elige alguna en la pestaña Plan.</div>`;
  const fruit = S.settings.fruit && sh.persons > 0;
  const total = all.length + (fruit ? 1 : 0), done = all.filter(it => checked[it.key]).length + (fruit && checked.__fruta ? 1 : 0);
  const item = it => { const b = buyText(it.key, it.g), i = ingOf(it.key);
    const det = i.fresh ? (it.days.length > 1 ? 'Por días: ' + it.days.map(([d, g]) => `${DAYS_SHORT[d]} ${Math.round(g)} g`).join(', ') : 'Para el ' + DAYS[it.days[0][0]].toLowerCase()) : 'Para ' + [...new Set(it.days.map(x => DAYS_SHORT[x[0]]))].join(', ');
    return `<button class="item" role="checkbox" aria-checked="${!!checked[it.key]}" data-act="check" data-k="${esc(it.key)}"><span class="box">${checked[it.key] ? ICON.check : ''}</span>
      <span><span class="iname">${esc(i.n)}</span><br><span class="iqty">${esc(b.q)}</span>${b.d ? ` <span class="idet">${esc(b.d)}</span>` : ''}<br><span class="idet">${det}</span></span></button>`; };
  const casa = groups.casa || [];
  return `${weekNav()}
  <div class="listhead"><h2>Lista de la compra</h2><span class="small muted">${done} de ${total}</span></div>
  <div class="progress" aria-hidden="true"><span style="width:${Math.round(done/total*100)}%"></span></div>
  ${buyA.map(([a, name]) => `<section class="aisle"><h2>${name}</h2><div class="items">${groups[a].map(item).join('')}</div></section>`).join('')}
  ${fruit ? `<section class="aisle"><h2>Postre</h2><div class="items"><button class="item" role="checkbox" aria-checked="${!!checked.__fruta}" data-act="check" data-k="__fruta"><span class="box">${checked.__fruta ? ICON.check : ''}</span><span><span class="iname">Fruta de temporada</span><br><span class="iqty">${sh.persons} piezas</span> <span class="idet">Una por persona y cena en casa</span></span></button></div></section>` : ''}
  <details class="casa aisle"><summary>Comprueba que tienes en casa (${casa.length + sh.spices.length})</summary>
    <ul>${casa.map(it => { const b = buyText(it.key, it.g); return `<li>${esc(ingOf(it.key).n)}: ${esc(b.q)}${b.d ? ' (' + esc(b.d) + ')' : ''}</li>`; }).join('')}${sh.spices.map(s => `<li>${esc(SPICES[s])}</li>`).join('')}</ul></details>
  <div class="actions"><button class="btn" data-act="copy">${ICON.copy}Copiar lo que falta</button><button class="btn" data-act="share">${ICON.share}Compartir</button></div>
  ${done ? '<p style="margin-top:12px"><button class="linkbtn small" data-act="uncheck">Desmarcar todo</button></p>' : ''}
  <p class="small muted" style="margin-top:14px">El pescado y la carne frescos, cómpralos como mucho 1–2 días antes o congélalos al llegar. Muchas pescaderías cierran domingo y lunes: el pescado del lunes, cómpralo el sábado.</p>`;
}
function shopText(onlyPending){
  const sh = shopping(curWeek), checked = S.checked[curWeek] || {};
  const L = [`Compra de las cenas (${weekTitle(curWeek)})`];
  AISLES.forEach(([a, name]) => { if (a === 'casa') return; const its = sh.items.filter(it => ingOf(it.key).a === a && !(onlyPending && checked[it.key])); if (!its.length) return;
    L.push('', name.toUpperCase()); its.forEach(it => { const b = buyText(it.key, it.g); L.push(`- ${ingOf(it.key).n}: ${b.q}${b.d ? ' (' + b.d.charAt(0).toLowerCase() + b.d.slice(1) + ')' : ''}`); }); });
  if (S.settings.fruit && sh.persons && !(onlyPending && checked.__fruta)) L.push('', 'POSTRE', `- Fruta de temporada: ${sh.persons} piezas`);
  return L.join('\n');
}

/* ---------- Vista: platos ---------- */

  const list = allComps().filter(c => c.kind === libKind).filter(c => !q || (c.name + ' ' + c.ing.map(r => (ingOf(r[0]) || {}).n).join(' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(q));
  const groups = libKind === 'p' ? Object.keys(PGROUPS).map(g => [PGROUPS[g], list.filter(c => c.group === g)]).filter(x => x[1].length) : [[null, list]];
  return `<h1 style="margin:6px 0 10px">Platos</h1>
  <div class="seg" role="group" aria-label="Tipo">${Object.entries({ p: 'Proteínas', v: 'Verduras', h: 'Hidratos', d: 'Platos completos' }).map(([k, l]) => `<button data-act="libkind" data-v="${k}" aria-pressed="${libKind === k}">${l}</button>`).join('')}</div>
  <label class="sr" for="q">Buscar</label><input id="q" class="search" type="search" placeholder="Buscar plato o ingrediente" value="${esc(libQ)}" autocomplete="off">
  <div class="actions" style="margin:0 0 14px"><button class="btn primary" data-act="newcomp">${ICON.plus}Añadir ${libKind === 'd' ? 'plato completo' : KINDS[libKind].toLowerCase()}</button>${AI ? `<button class="btn" data-act="ai">${ICON.spark}Crear con IA</button>` : ''}</div>
  <div id="rlist">${list.length ? groups.map(([g, cs]) => `${g ? `<h2 class="pickgroup">${g}</h2>` : ''}<div class="rlist">${cs.map(c => `<button class="rrow" data-act="opencomp" data-id="${esc(c.id)}" style="--c:var(--c${compColor(c)})"><span class="t"><h3>${esc(c.name)}${c.source ? `<span class="badge">${c.source === 'ai' ? 'IA' : 'Tuyo'}</span>` : ''}</h3><span class="meta"><span>${c.total} min</span><span>${equipTxt(c.equip || [])}</span></span></span></button>`).join('')}</div>`).join('') : '<div class="empty">No hay platos con esa búsqueda.</div>'}</div>`;
}

      ${t.mode === 'combo' || t.mode === 'dish' ? (t.list.filter(it => (t.mode === 'dish') === !!it.d).length ? `<ul class="rotlist">${t.list.map((it, k) => (t.mode === 'dish') === !!it.d ? `<li><span>${esc(itemTitle(t, it))}</span><button class="btn small" data-act="trem" data-d="${d}" data-k="${k}" aria-label="Quitar de la rotación">${ICON.close}</button></li>` : '').join('')}</ul>` : '<p class="small muted">La rotación está vacía: ese día saldrá "Por decidir".</p>') : ''}
    </div>`; }).join('')}
  <h2 class="section">Preferencias</h2>
  <div class="card">${sw('showNut', 'Mostrar valores nutricionales', 'Calorías y proteína estimadas por persona')}${sw('fruit', 'Fruta de postre en la lista', 'Una pieza por persona y cena en casa')}</div>
  <div class="card"><h3>Copia de seguridad</h3><p class="small muted" style="margin:4px 0 10px">Sirve para pasar tu plan a otro móvil o guardarlo.</p>
    <div class="actions" style="margin-top:0"><button class="btn" data-act="export">${ICON.copy}Copiar mis datos</button><button class="btn" data-act="import">Restaurar datos</button></div></div>
  <details class="card prose"><summary><b>Cómo se calculan las raciones</b></summary>
    <p><b>Fran.</b> El objetivo de cena es de 460–570 kcal con al menos 38 g de proteína, siguiendo tu plan. Cada cena te dice si está dentro, si es ligera o si se pasa. Los platos completos del domingo (pizza, sopas) se calculan igual, sin forzarlos.</p>

}

function render(keep){

/* ---------- Hojas ---------- */
let sheetCtx = {};
function pushSheet(kind, ctx){ sheetStack.push({ kind, ctx }); paintSheet(true); }
function popSheet(){ sheetStack.pop(); paintSheet(true); if (!sheetStack.length) render(true); }
function closeAll(){ sheetStack = []; paintSheet(true); }
function topSheet(){ return sheetStack[sheetStack.length - 1]; }
function paintSheet(reset){
  const el = $('#sheet'), top = topSheet();
  if (!top){ el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; return; }
  const body = el.querySelector('.sheetbody'); const y = body && !reset ? body.scrollTop : 0;
  const R = { recipe: renderRecipe, edit: renderEditDay, overview: renderOverview, copy: renderCopy, compedit: renderCompEdit, ai: renderAI, import: renderImport }[top.kind];
  el.innerHTML = R(top.ctx); el.hidden = false; document.body.style.overflow = 'hidden';
  const nb = el.querySelector('.sheetbody'); if (nb) nb.scrollTop = y;
  if (reset){ const b = el.querySelector('[data-act="back"]'); if (b) b.focus({ preventScroll: true }); }
}
const sheetHead = (title, icon = 'left') => `<div class="sheethead"><button class="iconbtn" data-act="back" aria-label="${icon === 'left' ? 'Volver' : 'Cerrar'}">${ICON[icon]}</button><h2 id="sheettitle">${esc(title)}</h2></div>`;

/* ---------- Receta (cena completa o componente suelto) ---------- */
function ingQty(key, g){
  const i = ingOf(key) || {};
  if (key === 'aceite'){ const c = g/10; return `${Math.round(g)} ml` + (Math.abs(c - Math.round(c)) < .05 && c >= 1 ? ` (${Math.round(c)} ${Math.round(c) === 1 ? 'cda' : 'cdas'})` : ''); }
  if (key === 'ajo'){ const n = Math.max(1, Math.round(g/5)); return `${n} ${n === 1 ? 'diente' : 'dientes'}`; }
  if (key === 'perejil') return 'un poco';
  if (key === 'limon') return g <= 20 ? 'unas gotas' : g <= 60 ? '½ limón' : '1 limón';
  return `${Math.round(g)} ${i.ml ? 'ml' : 'g'}`;
}
function renderRecipe(ctx){
  const cs = ctx.comps.map(comp).filter(Boolean); const m = ctx.mode;
  const e = ctx.entry || (cs[0].kind === 'd' ? { type: 'dish', d: cs[0].id } : { type: 'combo', p: cs[0].kind === 'p' ? cs[0].id : null, v: cs[0].kind === 'v' ? cs[0].id : null, h: cs[0].kind === 'h' ? cs[0].id : null });
  const title = ctx.single ? cs[0].name : entryTitle(e);
  const nf = entryNut(e, 'F'), nj = entryNut(e, 'J'), fl = franFlag(nf);
  const maxT = Math.max(...cs.map(c => c.total)); const total = maxT + (cs.length > 1 ? 2 : 0); const active = cs.reduce((a, c) => a + c.active, 0);
  const order = cs.slice().sort((a, b) => b.total - a.total).map(c => ({ c, start: maxT - c.total }));
  const merged = {}; cs.forEach(c => c.ing.forEach(([k, F, J, note]) => { if (!merged[k]) merged[k] = { k, F: 0, J: 0, notes: [] }; merged[k].F += F; merged[k].J += J; if (note) merged[k].notes.push(note); }));
  const ingRows = Object.values(merged).map(r => { const g = m === 'F' ? r.F : m === 'J' ? r.J : r.F + r.J; if (g <= 0) return '';
    const split = m === 'both' && r.F > 0 && r.J > 0 && !['perejil','limon','ajo'].includes(r.k) ? `<small>Fran ${ingQty(r.k, r.F)}, Judith ${ingQty(r.k, r.J)}</small>` : '';
    return `<li><span>${esc((ingOf(r.k) || {}).n || r.k)}${r.notes.length ? `<br><small class="muted">${esc(r.notes.join('; '))}</small>` : ''}</span><span class="q">${ingQty(r.k, g)}${split}</span></li>`; }).join('');
  const spices = [...new Set(cs.flatMap(c => c.spices || []))].filter(s => SPICES[s]);
  const plancha = cs.filter(c => (c.equip || []).includes('plancha')).length;
  const dk = ctx.dk; const dt = dk ? parseYmd(dk) : null;
  const steps = order.map(({ c, start }, ci) => `<div class="comphead"><h3>${esc(c.name)}</h3>${cs.length > 1 ? `<span class="small muted">${start === 0 ? 'Empieza por aquí' : `Empieza en el minuto ${start}`}</span>` : ''}</div>
    <ol class="steps">${c.steps.map(([t, min], si) => { const key = c.id + ':' + si; const done = ctx.done.has(key);
      return `<li class="step ${done ? 'done' : ''}"><button class="n" data-act="stepdone" data-k="${esc(key)}" aria-label="Marcar paso ${si+1} como hecho" aria-pressed="${done}">${done ? ICON.check : si+1}</button><div><p>${esc(t)}</p>${min ? `<div class="stepact"><button class="btn small" data-act="timer" data-c="${esc(c.id)}" data-i="${si}">${ICON.timer}${min} min</button></div>` : ''}</div></li>`; }).join('')}</ol>
    ${(c.tips || []).map(t => `<div class="tip"><b>Consejo.</b> ${esc(t)}</div>`).join('')}
    ${c.mercury ? '<div class="note"><b>Mercurio.</b> El emperador es un pescado grande con más mercurio. La AESAN recomienda que los adultos no abusen de él y que las embarazadas o quienes planean un embarazo lo eviten.</div>' : ''}
    ${c.note === 'anisakis' ? '<div class="note"><b>Anisakis.</b> Si lo dejas poco hecho por dentro, usa atún que haya estado congelado (en casa: a −20 °C al menos 5 días). Si lo haces del todo, no hace falta.</div>' : ''}`).join('');
  return `${sheetHead(title)}<div class="sheetbody"><div class="wrap ${ctx.big ? 'big' : ''}">
    <div class="rhero" style="--c:var(--c${compColor(cs[0])})"><p class="small muted" style="margin:0 0 4px">${dt ? `${DAYS[(dt.getDay()+6)%7]} ${dt.getDate()} de ${MONTHS[dt.getMonth()]}` : KINDS[cs[0].kind]}${cs.some(c => c.source) ? ' <span class="badge">' + (cs.some(c => c.source === 'ai') ? 'IA' : 'Tuyo') + '</span>' : ''}</p><h1>${esc(title)}</h1></div>
    <div class="facts"><div class="fact"><b>${active} min</b><span>de trabajo</span></div><div class="fact"><b>${total} min</b><span>en total</span></div><div class="fact"><b style="font-size:1rem;line-height:1.3">${equipTxt(cs.flatMap(c => c.equip || []))}</b><span>${plancha > 1 ? `${plancha} sartenes a la vez` : 'necesitas'}</span></div></div>
    ${S.settings.showNut ? (nf && nj ? `<div class="nutwrap"><table class="nut"><thead><tr><th><span class="sr">Persona</span></th><th>kcal</th><th>Proteína</th>${nf.f != null ? '<th>Grasa</th><th>Hidratos</th>' : ''}</tr></thead><tbody>
      ${[['Fran', nf], ['Judith', nj]].map(([w, n]) => `<tr><td>${w}</td><td>${Math.round(n.k)}</td><td>${Math.round(n.p)} g</td>${n.f != null ? `<td>${Math.round(n.f)} g</td><td>${Math.round(n.c)} g</td>` : ''}</tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin:6px 0 0">${ctx.single ? 'Solo esta parte del plato. ' : ''}Estimación; sin contar la fruta de postre.${!ctx.single && fl ? ` <span class="tag ${fl.cls}">${fl.t}</span>` : ''}</p>` : '<p class="small muted">Sin valores nutricionales: algún ingrediente no tiene datos.</p>') : ''}
    ${cs.length > 1 ? `<h2 class="section">Orden para que todo salga a la vez</h2><ul class="timeline">${order.map(({ c, start }) => `<li><b class="min">Min ${start}</b><span>${esc(c.name)} <span class="muted small">(${c.total} min)</span></span></li>`).join('')}<li><b class="min">Min ${maxT}</b><span>Emplatar</span></li></ul>` : ''}
    <h2 class="section">Ingredientes</h2>
    <div class="seg" role="group" aria-label="Raciones">${[['both','Los dos'],['F','Solo Fran'],['J','Solo Judith']].map(([v, l]) => `<button data-act="mode" data-v="${v}" aria-pressed="${m === v}">${l}</button>`).join('')}</div>
    <ul class="ings">${ingRows}</ul>${spices.length ? `<p class="extra">Además: ${spices.map(s => SPICES[s].toLowerCase()).join(', ')}.</p>` : ''}
    <div class="row section" style="margin-bottom:6px"><h2>Pasos</h2><button class="btn small" data-act="big" aria-pressed="${!!ctx.big}">${ctx.big ? 'Letra normal' : 'Modo cocina'}</button></div>
    ${steps}
    ${ctx.single && cs[0].source ? `<div class="actions"><button class="btn" data-act="editcomp" data-id="${esc(cs[0].id)}">${ICON.edit}Editar</button><button class="btn" data-act="delcomp" data-id="${esc(cs[0].id)}">Borrar</button></div>` : ''}
    ${dk ? `<div class="actions"><button class="btn" data-act="edit" data-dk="${dk}">${ICON.edit}Cambiar esta cena</button></div>` : ''}
  </div></div>`;
}
function openRecipeFor(dk){ const e = entryFor(dk); if (!cookable(e)) return openEdit(dk); pushSheet('recipe', { dk, entry: e, comps: entryComps(e).map(c => c.id), mode: modeFor(dk), done: new Set(), big: false }); }
function modeFor(dk){ const [f, j] = diners(dk); return f && j ? 'both' : f ? 'F' : j ? 'J' : 'both'; }

/* ---------- Editar una cena ---------- */
function openEdit(dk){
  const e = entryFor(dk);
  const draft = e.type === 'combo' ? { type: 'combo', p: e.p, v: e.v, h: e.h } : e.type === 'dish' ? { type: 'dish', d: e.d } : { type: e.type, note: e.missing ? '' : (e.note || '') };
  if (draft.type !== 'combo'){ draft.p = draft.p || null; }
  pushSheet('edit', { dk, draft, addRot: false });
}
function chipList(items, sel, act, extra = ''){ return `<div class="chips">${items.map(c => `<button class="chip ${sel === c.id ? 'sel' : ''}" data-act="${act}" data-id="${esc(c.id)}" aria-pressed="${sel === c.id}">${esc(c.name)}</button>`).join('')}${extra}</div>`; }

      <h2 class="section">Proteína</h2>

      <h2 class="section">Verdura</h2>${chipList(V, d.v, 'pickv', `<button class="chip ${!d.v ? 'sel' : ''}" data-act="pickv" data-id="" aria-pressed="${!d.v}">Sin verdura</button>`)}
      <h2 class="section">Hidrato</h2>${chipList(H, d.h, 'pickh', `<button class="chip ${!d.h ? 'sel' : ''}" data-act="pickh" data-id="" aria-pressed="${!d.h}">Sin hidrato</button>`)}`;
  } else if (d.type === 'dish'){
    const D = allComps().filter(c => c.kind === 'd'); const nf = d.d ? entryNut(d, 'F') : null; const fl = franFlag(nf);

let timers = [], tid = 0, audioCtx = null, tick = null;
function beep(){ try { if (!audioCtx) return; const t0 = audioCtx.currentTime; [0, .35, .7].forEach(dt => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.0001, t0+dt); g.gain.exponentialRampToValueAtTime(.3, t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.25); o.start(t0+dt); o.stop(t0+dt+.3); }); } catch(e){} try { navigator.vibrate && navigator.vibrate([300,150,300,150,300]); } catch(e){} }

  try { if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
  timers.push({ id: ++tid, label, end: Date.now() + min*60000, left: min*60000, paused: false, ring: false, rung: 0 });
  if (!tick) tick = setInterval(updTimers, 250); paintTimers(); toast(`Temporizador de ${min} min en marcha`);
}
function updTimers(){ const now = Date.now(); timers.forEach(t => { if (!t.paused && !t.ring){ t.left = t.end - now; if (t.left <= 0){ t.left = 0; t.ring = true; } } if (t.ring && t.rung < 3 && (!t.last || now - t.last > 4000)){ t.last = now; t.rung++; beep(); } }); if (!timers.length){ clearInterval(tick); tick = null; } paintTimers(); }
const fmt = ms => { const s = Math.ceil(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function paintTimers(){ $('#timers').innerHTML = timers.map(t => `<div class="timer ${t.ring ? 'ring' : ''}"><span class="lbl">${t.ring ? '¡Listo! ' : ''}${esc(t.label)}</span><span class="tm">${t.ring ? '0:00' : fmt(t.left)}</span>${t.ring ? '' : `<button data-act="tpause" data-t="${t.id}" aria-label="${t.paused ? 'Reanudar' : 'Pausar'}">${t.paused ? ICON.play : ICON.pause}</button>`}<button data-act="tclose" data-t="${t.id}" aria-label="Quitar temporizador">${ICON.close}</button></div>`).join(''); }
let wakeLock = null;
async function setWake(on){ try { if (on && 'wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); return true; } if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; } } catch(e){ wakeLock = null; } return false; }
async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) return true; } catch(e){}
  return false;
}

/* ---------- Acciones ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, top = topSheet(), ctx = top && top.ctx;
  switch (a){
    case 'tab': view = b.dataset.v; closeAll(); render(); break;
    case 'wk': curWeek = ymd(addDays(parseYmd(curWeek), 7 * Number(b.dataset.d))); render(); break;
    case 'wkdef': curWeek = curMonday(); render(); break;
    case 'overview': pushSheet('overview', {}); break;
    case 'gowk': curWeek = b.dataset.k; closeAll(); view = 'plan'; render(); break;
    case 'who': { const dk = b.dataset.dk, p = +b.dataset.p; const c = diners(dk).slice(); c[p] = !c[p]; if (c[0] && c[1]) delete S.diners[dk]; else S.diners[dk] = c; save(); render(true); break; }
    case 'open': openRecipeFor(b.dataset.dk); break;
    case 'edit': if (top && top.kind === 'recipe') sheetStack.pop(); openEdit(b.dataset.dk); break;
    case 'back': if (top && top.kind === 'ai' && aiCtl) aiCtl.abort(); if (top && top.kind === 'recipe' && ctx.big) setWake(false); popSheet(); break;
    case 'dtype': { const t = b.dataset.v; const d = ctx.draft; if (t === d.type) break; ctx.draft = t === 'combo' ? { type: 'combo', p: null, v: null, h: null } : t === 'dish' ? { type: 'dish', d: null } : { type: t, note: t === 'na' ? '' : '' }; ctx.addRot = false; paintSheet(); break; }
    case 'pickp': case 'pickv': case 'pickh': { const k = a.slice(-1); ctx.draft[k] = b.dataset.id || null; paintSheet(); break; }
    case 'pickd': ctx.draft.d = b.dataset.id; paintSheet(); break;
    case 'rand': ctx.draft = randomFor(ctx.draft); paintSheet(); break;
    case 'nanote': ctx.draft.note = b.dataset.v; paintSheet(); break;
    case 'addrot': ctx.addRot = !ctx.addRot; paintSheet(); break;
    case 'saveday': {
      const d = ctx.draft; const inp = $('#notein');
      if (inp && inp.value.trim()) d.note = inp.value.trim();
      else if (inp && d.type === 'tbd') d.note = '';
      const e = d.type === 'combo' ? { type: 'combo', p: d.p || null, v: d.v || null, h: d.h || null } : d.type === 'dish' ? { type: 'dish', d: d.d } : { type: d.type, note: d.note || '' };
      if (!validEntry(e)) break;
      S.plan[ctx.dk] = e;
      if (ctx.addRot){ const wd = (parseYmd(ctx.dk).getDay() + 6) % 7; const t = S.template[wd]; const want = e.type === 'dish' ? 'dish' : 'combo';
        if (t.mode !== want){ t.mode = want; t.list = []; }
        const item = want === 'dish' ? { d: e.d } : { p: e.p, v: e.v, h: e.h };
        if (!t.list.some(x => JSON.stringify(x) === JSON.stringify(item))) t.list.push(item); }
      save(); closeAll(); render(true); toast(ctx.addRot ? 'Guardado y añadido a la rotación' : 'Cena guardada'); break;
    }
    case 'dayreset': delete S.plan[ctx.dk]; save(); closeAll(); render(true); toast('Vuelve a la plantilla'); break;
    case 'vary': {
      let n = 0;
      weekDates(curWeek).forEach(dt => { const dk = ymd(dt), e = entryFor(dk); if (e.type !== 'combo') return; S.plan[dk] = randomFor(e); n++; });
      save(); render(true); toast(n ? `${n} combinaciones nuevas` : 'No hay combinaciones que variar esta semana'); break;
    }
    case 'resetweek': if (!confirm('Se sustituirán las cenas fijadas de esta semana por las de la plantilla. ¿Seguir?')) break; weekDates(curWeek).forEach(dt => delete S.plan[ymd(dt)]); save(); render(true); toast('Semana con la plantilla'); break;
    case 'check': { const w = S.checked[curWeek] = S.checked[curWeek] || {}; const k = b.dataset.k; if (w[k]) delete w[k]; else w[k] = true; save(); render(true); break; }
    case 'uncheck': S.checked[curWeek] = {}; save(); render(true); break;
    case 'copy': { const t = shopText(true); if (await copyText(t)) toast('Lista copiada'); else pushSheet('copy', { text: t }); break; }
    case 'share': { const t = shopText(true); try { if (navigator.share){ await navigator.share({ title: 'Lista de la compra', text: t }); break; } } catch(e){ if (e && e.name === 'AbortError') break; } if (await copyText(t)) toast('Lista copiada para pegar'); else pushSheet('copy', { text: t }); break; }
    case 'libkind': libKind = b.dataset.v; render(true); break;
    case 'opencomp': pushSheet('recipe', { comps: [b.dataset.id], single: true, mode: 'both', done: new Set(), big: false }); break;
    case 'newcomp': pushSheet('compedit', { form: blankForm(libKind) }); break;
    case 'ai': pushSheet('ai', { kind: libKind }); break;
    case 'aigo': if (AI) runAI(); break;
    case 'aistop': if (aiCtl) aiCtl.abort(); break;
    case 'editcomp': pushSheet('compedit', { form: compToForm(comp(b.dataset.id)) }); break;
    case 'delcomp': {
      const id = b.dataset.id; const used = Object.values(S.plan).some(e => [e.p, e.v, e.h, e.d].includes(id)) || Object.values(S.template).some(t => t.list.some(x => [x.p, x.v, x.h, x.d].includes(id)));
      if (!confirm(used ? 'Este plato está en el plan o en la plantilla. Si lo borras, esas cenas quedarán por decidir. ¿Borrarlo?' : '¿Borrar este plato?')) break;
      delete S.custom.comps[id]; Object.values(S.template).forEach(t => t.list = t.list.filter(x => ![x.p, x.v, x.h, x.d].includes(id)));
      for (const [k, e] of Object.entries(S.plan)) if (e.type === 'combo' && [e.p, e.v, e.h].includes(id)){ ['p','v','h'].forEach(s => { if (e[s] === id) e[s] = null; }); if (!e.p && !e.v && !e.h) S.plan[k] = { type: 'tbd', note: '' }; }
      save(); closeAll(); render(true); toast('Plato borrado'); break;
    }
    case 'feq': { readForm(); const k = b.dataset.k, eq = ctx.form.equip; ctx.form.equip = eq.includes(k) ? eq.filter(x => x !== k) : [...eq, k]; paintSheet(); break; }
    case 'rowadd': { readForm(); ctx.form.rows.push({ name: '', F: '', J: '', a: 'des' }); paintSheet(); const inputs = document.querySelectorAll('#rows .ingrow [data-f="name"]'); if (inputs.length) inputs[inputs.length - 1].focus(); break; }
    case 'rowdel': { readForm(); const i = +b.closest('.ingrow').dataset.row; ctx.form.rows.splice(i, 1); paintSheet(); break; }
    case 'savecomp': saveComp(); break;
    case 'set': S.settings[b.dataset.k] = !S.settings[b.dataset.k]; save(); render(true); break;
    case 'tmode': { const d = +b.dataset.d, t = S.template[d]; t.mode = b.dataset.v; if ((t.mode === 'combo' && t.list.some(x => x.d)) || (t.mode === 'dish' && t.list.some(x => !x.d))) t.list = t.list.filter(x => t.mode === 'dish' ? x.d : !x.d); save(); render(true); break; }
    case 'trem': { const t = S.template[+b.dataset.d]; t.list.splice(+b.dataset.k, 1); save(); render(true); break; }
    case 'export': { const t = JSON.stringify(S); if (await copyText(t)) toast('Datos copiados: pégalos donde quieras guardarlos'); else pushSheet('copy', { text: t, title: 'Tus datos' }); break; }
    case 'import': pushSheet('import', {}); break;
    case 'doimport': { let raw; try { raw = JSON.parse($('#impbox').value); } catch(e){ $('#imperr').textContent = 'Ese texto no son datos válidos de la app.'; break; } if (!raw || raw.v !== 2){ $('#imperr').textContent = 'Ese texto no son datos válidos de la app.'; break; } S = sanitize(raw); save(); closeAll(); render(); toast('Datos restaurados'); break; }
    case 'wipe': if (confirm('¿Borrar tus cambios y volver al plan del Excel?')){ try { localStorage.removeItem(STORE_KEY); } catch(e){} load(); render(); toast('Datos borrados'); } break;
    case 'mode': ctx.mode = b.dataset.v; paintSheet(); break;
    case 'stepdone': { const k = b.dataset.k; ctx.done.has(k) ? ctx.done.delete(k) : ctx.done.add(k); paintSheet(); break; }
    case 'timer': { const c = comp(b.dataset.c), i = +b.dataset.i; startTimer(`${c.name}: paso ${i+1}`, c.steps[i][1]); break; }
    case 'big': ctx.big = !ctx.big; if (ctx.big){ const ok = await setWake(true); toast(ok ? 'Modo cocina: la pantalla no se apagará' : 'Modo cocina: letra grande'); } else setWake(false); paintSheet(); break;
    case 'tpause': { const t = timers.find(x => x.id === +b.dataset.t); if (t){ if (t.paused){ t.end = Date.now() + t.left; t.paused = false; } else { t.left = t.end - Date.now(); t.paused = true; } paintTimers(); } break; }
    case 'tclose': timers = timers.filter(x => x.id !== +b.dataset.t); paintTimers(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q'){ libQ = t.value; const el = $('#rlist'); if (el){ const tmp = document.createElement('div'); tmp.innerHTML = renderLib(); el.innerHTML = tmp.querySelector('#rlist').innerHTML; } }
  if (t.dataset.tnote != null){ S.template[+t.dataset.tnote].note = t.value; save(); }
  if (t.dataset.f === 'name'){ const row = t.closest('.ingrow'); const known = ING_NAMES()[t.value.trim().toLowerCase()]; row.querySelector('.aisle').hidden = !!known; }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'f-kind'){ readForm(); paintSheet(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheetStack.length){ const top = topSheet(); if (top.kind === 'ai' && aiCtl) aiCtl.abort(); popSheet(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ const top = topSheet(); if (top && top.kind === 'recipe' && top.ctx.big) setWake(true); } });

/* ---------- Inicio ---------- */
load(); render();
try {
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('sample').then(fn => { if (fn && typeof fn.json === 'function'){ AI = fn; if (view === 'lib' && !sheetStack.length) render(true); } }).catch(() => {});
  }
} catch(e){}
window.__app = { entryFor, entryTitle, entryNut, shopping, shopText, buyText, weekDates, comp, get state(){ return S; }, get week(){ return curWeek; }, aiToForm, aiPrompt, templateEntry };
})();

</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
