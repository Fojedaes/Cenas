<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenas de la semana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cenas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Menú de cenas de domingo a jueves con lista de la compra y recetas paso a paso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EDE6; --line:#D3DBD1;
  --text:#1D2A23; --muted:#56655C; --primary:#2C5E46; --primary-ink:#FFFFFF; --focus:#1F7A55;
  --warn:#9A5B00; --warn-bg:#FFF1D6; --ok:#2C6B3F; --ok-bg:#E1F1E3; --danger:#A3352B;
  --cB:#4C7BAA; --cA:#1C5986; --cP:#B37A12; --cC:#A3402C; --cV:#4A8239; --leg:#7E5F33;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 6px 18px rgba(20,40,30,.06);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111714; --surface:#19211D; --surface-2:#222C27; --line:#2F3B35;
    --text:#E4EBE6; --muted:#9DAEA4; --primary:#7CC4A0; --primary-ink:#0E1A14; --focus:#9BE0BD;
    --warn:#F2BC63; --warn-bg:#3A2E17; --ok:#8FD3A4; --ok-bg:#1D3326; --danger:#F08A7E;
    --cB:#7FA9D6; --cA:#5E9FD1; --cP:#E0AE4C; --cC:#E07E66; --cV:#87C06F; --leg:#C79C62;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111714; --surface:#19211D; --surface-2:#222C27; --line:#2F3B35;
  --text:#E4EBE6; --muted:#9DAEA4; --primary:#7CC4A0; --primary-ink:#0E1A14; --focus:#9BE0BD;
  --warn:#F2BC63; --warn-bg:#3A2E17; --ok:#8FD3A4; --ok-bg:#1D3326; --danger:#F08A7E;
  --cB:#7FA9D6; --cA:#5E9FD1; --cP:#E0AE4C; --cC:#E07E66; --cV:#87C06F; --leg:#C79C62;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 150px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabecera de semana */
.weekhead{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.weekhead h1{flex:1;font-size:1.5rem}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:14px}
.linkbtn{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* Resumen de equilibrio */
.balance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin-bottom:16px}
.bar{display:flex;gap:3px;margin:2px 0 12px}
.bar span{flex:1;font-size:.72rem;color:var(--muted);text-align:center}
.bar span::before{content:"";display:block;height:10px;border-radius:5px;background:var(--seg);margin-bottom:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.85rem;background:var(--surface-2);line-height:1.3}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.avg{margin-top:8px;font-size:.9rem;color:var(--muted)}

/* Tarjetas de día */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:62px 1fr;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.day.today{border-color:var(--primary);border-width:2px}
.date{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 0;border-right:4px solid var(--c);background:color-mix(in srgb, var(--c) 9%, transparent)}
.date b{font-family:var(--f-display);font-size:1.85rem;font-weight:800;line-height:1}
.date span{font-size:.8rem;color:var(--muted);text-transform:lowercase}
.hoy{color:var(--primary)}
.daybody{padding:12px 12px 10px 14px;min-width:0}
.dayname{display:block;width:100%;text-align:left}
.dayname h3{font-size:1.08rem;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:var(--muted);align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;margin-right:4px;vertical-align:1px}
.legtag{color:var(--leg);font-weight:700}
.dayfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.who{display:flex;gap:6px}
.chip{min-height:36px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);font-size:.875rem;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chip[aria-pressed="true"]{background:color-mix(in srgb, var(--primary) 14%, var(--surface));border-color:color-mix(in srgb, var(--primary) 45%, var(--surface));color:var(--text);font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted)}
.who .chip[aria-pressed="false"]{text-decoration:line-through;border-style:dashed}
.chip svg{width:14px;height:14px}
.btn{min-height:44px;padding:0 14px;white-space:nowrap;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.small{min-height:36px;padding:0 10px;font-size:.9rem;border-radius:10px}
.btn.full{width:100%}
.btn svg{width:18px;height:18px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.actions .btn{width:100%}
@media (min-width:520px){.actions{flex-direction:row}.actions .btn{flex:1}}
.nobody{font-size:.85rem;color:var(--warn)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:.78rem;color:var(--muted);min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary);font-weight:700}

/* Lista de la compra */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 0 12px}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--primary);transition:width .2s}
.aisle{margin-bottom:18px}
.aisle h2{font-size:1.05rem;margin:0 0 6px;color:var(--muted);font-weight:700}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.item[aria-checked="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.item[aria-checked="true"] .iname{text-decoration:line-through;color:var(--muted)}
.box svg{width:16px;height:16px}
.iname{font-weight:700}
.iqty{font-size:.9rem}
.idet{font-size:.8rem;color:var(--muted)}
.casa summary{cursor:pointer;font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:1.05rem;min-height:40px;display:flex;align-items:center}
.casa ul{margin:4px 0 0;padding:12px 14px 12px 32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.casa li{margin:2px 0}

/* Recetas */
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;margin:8px 0 10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;text-align:left;width:100%;border-left:5px solid var(--c)}
.rrow .t{flex:1;min-width:0}
.rrow h3{font-size:1rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Hojas superpuestas */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheethead{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheethead h2{flex:1;font-size:1.05rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetbody .wrap{padding-bottom:160px}
.rhero{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin:8px 0 14px}
.rhero h1{font-size:1.6rem;margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fact b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.fact span{font-size:.8rem;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.section{margin:22px 0 10px}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings .q{text-align:right;flex:none;max-width:48%}
.ings .q small{display:block;color:var(--muted);font-size:.78rem}
.extra{font-size:.9rem;color:var(--muted);margin-top:8px}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.step .n{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center;font-weight:700;color:var(--primary);font-family:var(--f-display)}
.step.done{opacity:.55}
.step.done .n{background:var(--primary);color:var(--primary-ink)}
.step p{margin:0}
.big .step p{font-size:1.15rem;line-height:1.55}
.stepact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.note{background:var(--warn-bg);color:var(--text);border-radius:var(--r-m);padding:12px 14px;margin-top:12px;font-size:.92rem}
.note b{color:var(--warn)}
.tip{background:var(--surface-2);border-radius:var(--r-m);padding:12px 14px;margin-top:10px;font-size:.92rem}
.nutwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.nut{width:100%;border-collapse:collapse;font-size:.88rem}
table.nut th{font-weight:700;color:var(--muted);font-size:.8rem}
table.nut th,table.nut td{padding:8px 8px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
table.nut th:first-child,table.nut td:first-child{text-align:left}
table.nut tr:last-child td{border-bottom:0}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Cambiar plato */
.alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;border-left:5px solid var(--c)}
.alt .t{flex:1}
.alt .why{font-size:.8rem;color:var(--warn);margin-top:2px}
.alt .good{font-size:.8rem;color:var(--ok);margin-top:2px}

.ovw{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.ovh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);margin-bottom:6px}
.ovl{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.ovl .dot{background:var(--c)}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.swrow{width:100%;text-align:left;padding:6px 0;min-height:56px}
.swrow[aria-checked="true"] .switch{background:var(--primary)}
.swrow[aria-checked="true"] .switch::after{transform:translateX(22px)}
.prose p{margin:.5em 0}
.prose ul{padding-left:1.2em;margin:.4em 0}

/* Temporizadores */
.timers{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;pointer-events:none}
.timers .in{max-width:720px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;gap:6px}
.timer{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .lbl{flex:1;font-size:.85rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tm{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.timer button{min-width:40px;min-height:40px;border-radius:10px;display:grid;place-items:center}
.timer button svg{width:18px;height:18px}
.timer.ring{background:var(--primary);color:var(--primary-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:.9rem;max-width:90vw}
.copybox{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px;font:inherit;font-size:.9rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.facts{grid-template-columns:repeat(3,160px)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheettitle"></div>
<div class="timers" aria-live="polite"><div class="in" id="timers"></div></div>
<div class="tabs"><nav id="tabs" aria-label="Secciones"></nav></div>

<script>
/* ==== DATOS: ingredientes (valores por 100 g o 100 ml, tablas estándar BEDCA/USDA, aproximados) ==== */
const AISLES = [
  ['fru', 'Frutería y verdura'],
  ['pes', 'Pescadería'],
  ['car', 'Carnicería'],
  ['ref', 'Refrigerados'],
  ['con', 'Congelados'],
  ['lat', 'Conservas y legumbres'],
  ['des', 'Despensa'],
  ['casa', 'Comprueba que tienes en casa']
];

/* k kcal, p proteína, f grasa, c hidratos disponibles. u = unidad de compra:
   {g: gramos útiles por unidad, s: singular, pl: plural, pack: true si se vende en envase cerrado} */
const ING = {
  merluza:      { n: 'Merluza en lomos', a: 'pes', k: 75, p: 17, f: 0.9, c: 0, fresh: true },
  gallineta:    { n: 'Gallineta en filetes, con piel', a: 'pes', k: 90, p: 18.5, f: 1.5, c: 0, fresh: true },
  bacalao:      { n: 'Bacalao en lomos (fresco o desalado)', a: 'pes', k: 80, p: 18, f: 0.7, c: 0, fresh: true },
  salmon:       { n: 'Salmón en lomos, con piel', a: 'pes', k: 208, p: 20, f: 13.4, c: 0, fresh: true },
  atun:         { n: 'Atún rabil fresco', a: 'pes', k: 115, p: 24, f: 1.5, c: 0, fresh: true },
  emperador:    { n: 'Emperador en rodajas de 2 cm', a: 'pes', k: 144, p: 19.8, f: 6.7, c: 0, fresh: true },
  sepia:        { n: 'Sepia limpia (fresca o congelada)', a: 'pes', k: 79, p: 16.2, f: 0.7, c: 0.8 },
  gambas:       { n: 'Gambas peladas congeladas', a: 'con', k: 78, p: 17.5, f: 0.8, c: 0 },
  pollo:        { n: 'Pechuga de pollo', a: 'car', k: 113, p: 23.5, f: 1.9, c: 0, fresh: true },
  contramuslo:  { n: 'Contramuslo de pollo deshuesado, sin piel', a: 'car', k: 121, p: 19.7, f: 4.1, c: 0, fresh: true },
  pavo:         { n: 'Pechuga de pavo en filetes', a: 'car', k: 105, p: 24, f: 1, c: 0, fresh: true },
  pavo_picado:  { n: 'Carne picada de pavo', a: 'car', k: 130, p: 20, f: 5.5, c: 0, fresh: true },
  lomo:         { n: 'Cinta de lomo de cerdo (filetes de 1,5 cm)', a: 'car', k: 150, p: 21, f: 7, c: 0, fresh: true },
  ternera:      { n: 'Bistec de ternera magro', a: 'car', k: 131, p: 21.5, f: 5, c: 0, fresh: true },
  ternera_picada:{ n: 'Carne picada de ternera (máx. 10 % grasa)', a: 'car', k: 170, p: 20, f: 10, c: 0, fresh: true },
  jamon:        { n: 'Taquitos de jamón serrano', a: 'ref', k: 240, p: 30, f: 13.5, c: 0 },
  tofu:         { n: 'Tofu firme', a: 'ref', k: 125, p: 13, f: 7.5, c: 1.5, u: { g: 250, s: 'bloque de ~250 g', pl: 'bloques de ~250 g', pack: true } },

function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function generate(k){

    base.filter(r => !current.has(r.id)),

    return { q: `${Math.round(g)} ml`, d: '' };
  }
  if (key === 'ajo'){ const n = Math.max(1, Math.ceil(g / 5 - 1e-9)); return { q: `${n} ${n === 1 ? 'diente' : 'dientes'}`, d: '' }; }
  if (key === 'perejil') return { q: 'un poco', d: '' };
  if (key === 'limon'){ const n = Math.max(1, Math.ceil(g / 100 - 1e-9)); return { q: `${n} ${n === 1 ? 'limón' : 'limones'}`, d: '' }; }
  const u = i.u;
  if (!u) return { q: gtxt(round10(g)), d: '' };
  const sfx = u.sfx || '';
  if (u.pack){ const n = Math.max(1, Math.ceil(g / u.g - 0.02)); const left = n * u.g - g; return { q: `${n} ${n === 1 ? u.s : u.pl}`, d: `Necesitas ${gtxt(round10(g))}${sfx}` + (left >= u.g * 0.3 ? `; sobran unos ${gtxt(Math.floor(left / 10) * 10)}` : '') }; }
  if (u.frac){ const x = g / u.g; const t = frac(x); const one = Math.ceil(x*4-1e-9)/4 <= 1; return { q: `${t} ${one ? u.s : u.pl}`, d: `Necesitas unos ${gtxt(round10(g))}${sfx}` }; }
  const x = Math.max(.5, halfUp(g / u.g)); return { q: `${numTxt(x)} ${x <= 1 ? u.s : u.pl}`, d: `Necesitas unos ${gtxt(round10(g))}${sfx}` };
}
function shopping(k){
  const menu = menuFor(k); const items = {}; const spices = new Set(); let persons = 0;
  menu.forEach((id, d) => {
    const r = R[id]; const [f, j] = diners(k, d); if (!f && !j) return;
    persons += (f?1:0) + (j?1:0);
    r.spices.forEach(s => spices.add(s));
    r.ing.forEach(([key, F, J]) => {
      const g = (f ? F : 0) + (j ? J : 0); if (g <= 0) return;
      if (!items[key]) items[key] = { key, g: 0, days: [] };
      items[key].g += g; items[key].days.push([d, g]);
    });
  });
  return { items: Object.values(items), spices: [...spices], persons };
}

function shopText(onlyPending){

function recipeFilters(){
  return [['all','Todas'],['B','Pescado blanco'],['A','Pescado azul'],['P','Ave'],['C','Carne'],['V','Vegetal'],['leg','Con legumbre'],['fast','25 min o menos'],['fav','Favoritas'],['ex','Descartadas']];

function filteredRecipes(){
  const q = filt.q.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return RECIPES.filter(r => {
    const f = filt.f;
    if (['B','A','P','C','V'].includes(f) && r.cat !== f) return false;
    if (f === 'leg' && !r.legume) return false;
    if (f === 'fast' && r.total > 25) return false;
    if (f === 'fav' && !S.settings.favs.includes(r.id)) return false;
    if (f === 'ex' && !S.settings.excluded.includes(r.id)) return false;
    if (q){
      const hay = (r.name + ' ' + r.ing.map(x => ING[x[0]].n).join(' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}

function render(keepScroll){
  const y = window.scrollY;
  const html = view === 'week' ? renderWeek() : view === 'shop' ? renderShop() : view === 'book' ? renderBook() : renderSettings();
  $('#app').innerHTML = `<main class="wrap">${html}</main>`;
  renderTabs();
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- Receta ---------- */
let rctx = null; // { id, day, mode, done:Set, big }
function openRecipe(id, day){
  const portion = (day != null) ? (() => { const [f, j] = diners(curWeek, day); return f && j ? 'both' : f ? 'F' : j ? 'J' : 'both'; })() : 'both';
  rctx = { id, day, mode: portion, done: new Set(), big: false };
  pushSheet('recipe');
}
function ingQty(key, g){
  const i = ING[key];
  if (i.ml){ if (key === 'aceite'){ const c = g / 10; return `${Math.round(g)} ml` + (Math.abs(c - Math.round(c)) < .05 ? ` (${Math.round(c)} ${Math.round(c) === 1 ? 'cda' : 'cdas'})` : ''); } return `${Math.round(g)} ml`; }
  if (key === 'ajo'){ const n = Math.max(1, Math.round(g / 5)); return `${n} ${n === 1 ? 'diente' : 'dientes'}`; }
  if (key === 'perejil') return 'un poco';
  if (key === 'limon') return g <= 20 ? 'unas gotas' : g <= 60 ? '½ limón' : '1 limón';
  return `${Math.round(g)} g`;
}
function renderRecipe(){
  const r = R[rctx.id]; const m = rctx.mode; const fav = S.settings.favs.includes(r.id), ex = S.settings.excluded.includes(r.id);
  const nf = nutrition(r, 'F'), nj = nutrition(r, 'J');
  const ings = r.ing.map(([key, F, J, note]) => {
    const g = m === 'F' ? F : m === 'J' ? J : F + J; if (g <= 0) return '';
    const split = m === 'both' && F > 0 && J > 0 && !['perejil','limon','ajo'].includes(key) ? `<small>Fran ${ingQty(key, F)}, Judith ${ingQty(key, J)}</small>` : (m === 'both' && (F === 0 || J === 0) ? `<small>solo ${F === 0 ? 'Judith' : 'Fran'}</small>` : '');
    return `<li><span>${esc(ING[key].n)}${note ? `<br><small class="muted">${esc(note)}</small>` : ''}</span><span class="q">${ingQty(key, g)}${split}</span></li>`;
  }).join('');
  const stepHtml = r.steps.map(([t, min], i) => `<li class="step ${rctx.done.has(i) ? 'done' : ''}">
      <button class="n" data-act="stepdone" data-i="${i}" aria-label="Marcar paso ${i+1} como hecho" aria-pressed="${rctx.done.has(i)}">${rctx.done.has(i) ? ICON.check : i+1}</button>
      <div><p>${esc(t)}</p>${min ? `<div class="stepact"><button class="btn small" data-act="timer" data-i="${i}">${ICON.timer}${min} min</button></div>` : ''}</div></li>`).join('');
  const dayTxt = rctx.day != null ? `${DAYS[rctx.day]} ${weekDates(curWeek)[rctx.day].getDate()} de ${MONTHS[weekDates(curWeek)[rctx.day].getMonth()]}` : CATS[r.cat].n;
  return `<div class="sheethead"><button class="iconbtn" data-act="back" aria-label="Volver">${ICON.left}</button><h2 id="sheettitle">${esc(r.name)}</h2></div>
  <div class="sheetbody"><div class="wrap ${rctx.big ? 'big' : ''}">
    <div class="rhero" style="${catVar(r.cat)}">
      <p class="small muted" style="margin:0 0 4px">${esc(dayTxt)}</p>
      <h1>${esc(r.name)}</h1>
      <p style="margin:0">${esc(r.desc)}</p>
    </div>
    <div class="facts">
      <div class="fact"><b>${r.active} min</b><span>de trabajo</span></div>
      <div class="fact"><b>${r.total} min</b><span>en total</span></div>
      <div class="fact"><b style="font-size:1rem;line-height:1.3">${equipTxt(r)}</b><span>${r.equip.length ? 'necesitas' : 'no hay que cocinar'}</span></div>
    </div>
    ${S.settings.showNut ? `<div class="nutwrap"><table class="nut" aria-label="Valores estimados por ración"><thead><tr><th><span class="sr">Persona</span></th><th>kcal</th><th>Proteína</th><th>Grasa</th><th>Hidratos</th></tr></thead><tbody>
      <tr><td>Fran</td><td>${Math.round(nf.k)}</td><td>${Math.round(nf.p)} g</td><td>${Math.round(nf.f)} g</td><td>${Math.round(nf.c)} g</td></tr>
      <tr><td>Judith</td><td>${Math.round(nj.k)}</td><td>${Math.round(nj.p)} g</td><td>${Math.round(nj.f)} g</td><td>${Math.round(nj.c)} g</td></tr></tbody></table></div>
      <p class="small muted" style="margin:6px 0 0">Estimación con tablas estándar; sin contar la fruta de postre.</p>` : ''}
    <h2 class="section">Ingredientes</h2>
    <div class="seg" role="group" aria-label="Raciones">
      ${[['both','Los dos'],['F','Solo Fran'],['J','Solo Judith']].map(([v, l]) => `<button data-act="mode" data-v="${v}" aria-pressed="${m === v}">${l}</button>`).join('')}
    </div>
    <ul class="ings">${ings}</ul>
    ${r.spices.length ? `<p class="extra">Además: ${r.spices.map(s => SPICES[s].toLowerCase()).join(', ')}.</p>` : ''}
    <div class="row section" style="margin-bottom:6px"><h2>Pasos</h2><button class="btn small" data-act="big" aria-pressed="${rctx.big}">${rctx.big ? 'Letra normal' : 'Modo cocina'}</button></div>
    <ol class="steps">${stepHtml}</ol>
    ${r.tips.map(t => `<div class="tip"><b>Consejo.</b> ${esc(t)}</div>`).join('')}
    ${r.mercury ? `<div class="note"><b>Mercurio.</b> El emperador es un pescado grande con más mercurio. La AESAN recomienda que los adultos no abusen de él (aquí sale como mucho una vez por semana) y que las embarazadas o quienes planean un embarazo lo eviten. Si es tu caso, cámbialo por salmón o gallineta: la receta funciona igual.</div>` : ''}
    ${r.note === 'anisakis' ? `<div class="note"><b>Anisakis.</b> Si dejas el atún poco hecho por dentro, usa atún que haya estado congelado (en casa: a −20 °C al menos 5 días) o compra lomos ya congelados. Si lo haces del todo, no hace falta.</div>` : ''}
    <div class="toggles">
      <button class="btn small" data-act="fav" aria-pressed="${fav}">${fav ? 'Quitar de favoritas' : 'Marcar como favorita'}</button>
      <button class="btn small" data-act="ex" aria-pressed="${ex}">${ex ? 'Volver a proponer' : 'No proponer'}</button>
    </div>
    <p class="small muted" style="margin-top:8px">Las favoritas salen el doble cuando pides otra semana. Las que marques como "No proponer" se sustituyen por otro plato equivalente.</p>
  </div></div>`;
}

/* ---------- Cambiar plato ---------- */
let swapDay = null, swapF = 'same';
function renderSwap(){
  const menu = menuFor(curWeek), cur = R[menu[swapDay]], season = seasonFor(curWeek);
  const ex = new Set(S.settings.excluded);
  let cands = RECIPES.filter(r => r.id !== cur.id && seasonOk(r, season));
  if (swapF === 'same') cands = cands.filter(r => r.cat === cur.cat);
  else if (swapF !== 'all') cands = cands.filter(r => r.cat === swapF);
  const rows = cands.map(r => { const t = menu.slice(); t[swapDay] = r.id; const before = new Set(issues(menu)); const iss = issues(t).filter(x => !before.has(x)); const inWeek = menu.includes(r.id); return { r, iss, inWeek, ex: ex.has(r.id) }; })
    .sort((a, b) => (a.inWeek - b.inWeek) || (a.ex - b.ex) || (a.iss.length - b.iss.length) || (a.r.total - b.r.total));
  return `<div class="sheethead"><button class="iconbtn" data-act="back" aria-label="Cerrar">${ICON.close}</button><h2 id="sheettitle">Cambiar la cena del ${DAYS[swapDay].toLowerCase()}</h2></div>
  <div class="sheetbody"><div class="wrap">
    <p class="small muted" style="margin:6px 0 10px">Ahora: ${esc(cur.name)}</p>
    <div class="filters" role="group" aria-label="Tipo de plato">${[['same','Mismo tipo'],['all','Todas'],['B','Pescado blanco'],['A','Pescado azul'],['P','Ave'],['C','Carne'],['V','Vegetal']].map(([v, l]) => `<button class="chip" data-act="swapf" data-v="${v}" aria-pressed="${swapF === v}">${l}</button>`).join('')}</div>
    <div class="rlist">${rows.length ? rows.map(({ r, iss, inWeek, ex }) => `<button class="alt" data-act="pick" data-id="${r.id}" style="${catVar(r.cat)}">
      <span class="t"><b>${esc(r.name)}</b><br><span class="meta"><span>${CATS[r.cat].short}</span><span>${r.total} min</span>${r.legume ? '<span class="legtag">Legumbre</span>' : ''}</span>
      ${inWeek ? '<div class="why">Ya está en esta semana: se intercambiarán los días</div>' : ''}
      ${ex ? '<div class="why">La tienes marcada como "No proponer"</div>' : ''}
      ${iss.map(x => `<div class="why">${esc(x)}</div>`).join('')}
      ${!iss.length && !inWeek && !ex ? '<div class="good">Mantiene el equilibrio de la semana</div>' : ''}</span>
    </button>`).join('') : '<div class="empty">No hay alternativas de este tipo en esta temporada. Prueba con "Todas".</div>'}</div>
  </div></div>`;
}

/* ---------- Vista general ---------- */
function renderOverview(){
  const start = parseYmd(curWeek);
  const weeks = [0,1,2,3,4,5].map(i => ymd(addDays(start, 7 * i)));
  return `<div class="sheethead"><button class="iconbtn" data-act="back" aria-label="Cerrar">${ICON.close}</button><h2 id="sheettitle">Próximas 6 semanas</h2></div>
  <div class="sheetbody"><div class="wrap">
    <p class="small muted" style="margin:6px 0 12px">Cada plato sale una vez cada 6 semanas. Toca una semana para abrirla.</p>
    <div class="rlist">${weeks.map(k => { const m = menuFor(k); return `<button class="ovw" data-act="gowk" data-k="${k}">
      <span class="ovh"><b>${weekTitle(k)}</b>${isCustom(k) ? '<span class="small muted">personalizada</span>' : ''}</span>
      <span class="ovl">${m.map((id, i) => `<span style="${catVar(R[id].cat)}"><span class="dot"></span><span class="muted">${DAYS_SHORT[i]}</span> ${esc(R[id].name)}</span>`).join('')}</span>
    </button>`; }).join('')}</div>
  </div></div>`;
}

/* ---------- Copiar (respaldo) ---------- */
let copyTextVal = '';
function renderCopy(){
  return `<div class="sheethead"><button class="iconbtn" data-act="back" aria-label="Cerrar">${ICON.close}</button><h2 id="sheettitle">Copia la lista</h2></div>
  <div class="sheetbody"><div class="wrap"><p class="small muted">Tu navegador no deja copiar automáticamente. Mantén pulsado el texto, elige "Seleccionar todo" y copia.</p>
  <textarea class="copybox" readonly>${esc(copyTextVal)}</textarea></div></div>`;
}

/* ---------- Hojas ---------- */
function pushSheet(kind){ sheetStack.push(kind); paintSheet(true); }
function popSheet(){ sheetStack.pop(); paintSheet(true); if (!sheetStack.length) render(true); }
function paintSheet(resetScroll){
  const el = $('#sheet'); const kind = sheetStack[sheetStack.length - 1];
  if (!kind){ el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; return; }
  const body = el.querySelector('.sheetbody'); const y = body && !resetScroll ? body.scrollTop : 0;
  el.innerHTML = kind === 'recipe' ? renderRecipe() : kind === 'swap' ? renderSwap() : kind === 'overview' ? renderOverview() : renderCopy();
  el.hidden = false; document.body.style.overflow = 'hidden';
  const nb = el.querySelector('.sheetbody'); if (nb) nb.scrollTop = y;
  if (resetScroll){ const b = el.querySelector('[data-act="back"]'); if (b) b.focus({ preventScroll: true }); }
}

/* ---------- Temporizadores ---------- */
let timers = []; let tid = 0; let audioCtx = null; let tick = null;
function beep(){
  try {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [0, .35, .7].forEach(dt => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(.3, t0 + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .25); o.start(t0 + dt); o.stop(t0 + dt + .3); });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch(e){}
}
function startTimer(label, min){
  try { if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
  timers.push({ id: ++tid, label, end: Date.now() + min * 60000, left: min * 60000, paused: false, ring: false, rung: 0 });
  if (!tick) tick = setInterval(updTimers, 250);
  paintTimers(); toast(`Temporizador de ${min} min en marcha`);
}
function updTimers(){
  const now = Date.now(); let changed = false;
  timers.forEach(t => { if (!t.paused && !t.ring){ t.left = t.end - now; if (t.left <= 0){ t.left = 0; t.ring = true; changed = true; } } if (t.ring && t.rung < 3 && (!t.lastBeep || now - t.lastBeep > 4000)){ t.lastBeep = now; t.rung++; beep(); } });
  if (!timers.length){ clearInterval(tick); tick = null; }
  paintTimers(changed);
}
function fmt(ms){ const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function paintTimers(){
  $('#timers').innerHTML = timers.map(t => `<div class="timer ${t.ring ? 'ring' : ''}">
    <span class="lbl">${t.ring ? '¡Listo! ' : ''}${esc(t.label)}</span><span class="tm">${t.ring ? '0:00' : fmt(t.left)}</span>
    ${t.ring ? '' : `<button data-act="tpause" data-t="${t.id}" aria-label="${t.paused ? 'Reanudar' : 'Pausar'}">${t.paused ? ICON.play : ICON.pause}</button>`}
    <button data-act="tclose" data-t="${t.id}" aria-label="Quitar temporizador">${ICON.close}</button></div>`).join('');
}

/* ---------- Pantalla encendida ---------- */
let wakeLock = null;
async function setWake(on){
  try {
    if (on && 'wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); return true; }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
  return false;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && rctx && rctx.big) setWake(true); });

/* ---------- Copiar y compartir ---------- */
async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch(e){}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); if (ok) return true;
  } catch(e){}
  return false;
}

/* ---------- Acciones ---------- */
function setMenu(k, menu){ weekObj(k).menu = menu.slice(); save(); }
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'tab': view = b.dataset.v; if (sheetStack.length){ sheetStack = []; paintSheet(); } render(); break;
    case 'wk': curWeek = ymd(addDays(parseYmd(curWeek), 7 * Number(b.dataset.d))); render(); break;
    case 'wkdef': curWeek = defaultWeek(); render(); break;
    case 'who': {
      const d = +b.dataset.day, p = +b.dataset.p; const w = weekObj(curWeek);
      w.diners = w.diners || {}; const cur = diners(curWeek, d).slice(); cur[p] = !cur[p]; w.diners[d] = cur; save(); render(true); break;
    }
    case 'open': openRecipe(b.dataset.id, b.dataset.day != null ? +b.dataset.day : null); break;
    case 'back': if (rctx && sheetStack[sheetStack.length-1] === 'recipe' && rctx.big) setWake(false); popSheet(); break;
    case 'overview': pushSheet('overview'); break;
    case 'gowk': curWeek = b.dataset.k; sheetStack = []; paintSheet(); view = 'week'; render(); break;
    case 'swap': swapDay = +b.dataset.day; swapF = 'same'; pushSheet('swap'); break;
    case 'swapf': swapF = b.dataset.v; paintSheet(true); break;
    case 'pick': {
      const menu = menuFor(curWeek); const id = b.dataset.id; const j = menu.indexOf(id);
      if (j >= 0){ menu[j] = menu[swapDay]; }
      menu[swapDay] = id; setMenu(curWeek, menu); popSheet(); toast(j >= 0 ? `Intercambiado con el ${DAYS[j].toLowerCase()}` : 'Cena cambiada'); break;
    }
    case 'gen': {
      const g = generate(curWeek);
      if (!g){ toast('No hay suficientes platos disponibles: recupera alguno descartado en Ajustes'); break; }
      setMenu(curWeek, g); render(); toast('Nueva semana propuesta'); break;
    }
    case 'reset': { const w = S.weeks[curWeek]; if (w) delete w.menu; save(); render(); toast('Vuelves al menú de la rotación'); break; }
    case 'check': {
      const w = weekObj(curWeek); w.checked = w.checked || {}; const k = b.dataset.k;
      if (w.checked[k]) delete w.checked[k]; else w.checked[k] = true; save(); render(true); break;
    }
    case 'uncheck': { const w = weekObj(curWeek); w.checked = {}; save(); render(true); break; }
    case 'copy': {
      const text = shopText(true);
      if (await copyText(text)) toast('Lista copiada'); else { copyTextVal = text; pushSheet('copy'); }
      break;
    }
    case 'share': {
      const text = shopText(true);
      try { if (navigator.share){ await navigator.share({ title: 'Lista de la compra', text }); break; } } catch(e){ if (e && e.name === 'AbortError') break; }
      if (await copyText(text)) toast('Tu navegador no permite compartir desde aquí: lista copiada para pegar'); else { copyTextVal = text; pushSheet('copy'); }
      break;
    }
    case 'filt': filt.f = b.dataset.f; render(true); break;
    case 'set': S.settings[b.dataset.k] = !S.settings[b.dataset.k]; save(); render(true); break;
    case 'season': S.settings.season = b.dataset.v; save(); render(true); break;
    case 'unex': S.settings.excluded = S.settings.excluded.filter(x => x !== b.dataset.id); save(); render(true); toast('Plato recuperado'); break;
    case 'wipe': if (confirm('¿Borrar menús cambiados, listas marcadas y preferencias?')){ try { localStorage.removeItem(STORE_KEY); } catch(e){} load(); render(); toast('Datos borrados'); } break;
    case 'mode': rctx.mode = b.dataset.v; paintSheet(); break;
    case 'stepdone': { const i = +b.dataset.i; rctx.done.has(i) ? rctx.done.delete(i) : rctx.done.add(i); paintSheet(); break; }
    case 'timer': { const r = R[rctx.id]; const i = +b.dataset.i; startTimer(`Paso ${i+1}: ${r.name}`, r.steps[i][1]); break; }
    case 'big': rctx.big = !rctx.big; if (rctx.big){ const ok = await setWake(true); toast(ok ? 'Modo cocina: la pantalla no se apagará' : 'Modo cocina: letra grande'); } else setWake(false); paintSheet(); break;
    case 'fav': { const id = rctx.id, f = S.settings.favs; S.settings.favs = f.includes(id) ? f.filter(x => x !== id) : [...f, id]; save(); paintSheet(); break; }
    case 'ex': {
      const id = rctx.id, e = S.settings.excluded;
      const adding = !e.includes(id);
      S.settings.excluded = adding ? [...e, id] : e.filter(x => x !== id); save(); paintSheet();
      toast(adding ? 'No se volverá a proponer. Las semanas que no hayas cambiado a mano lo sustituyen' : 'Se volverá a proponer');
      break;
    }
    case 'tpause': { const t = timers.find(x => x.id === +b.dataset.t); if (t){ if (t.paused){ t.end = Date.now() + t.left; t.paused = false; } else { t.left = t.end - Date.now(); t.paused = true; } paintTimers(); } break; }
    case 'tclose': timers = timers.filter(x => x.id !== +b.dataset.t); paintTimers(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q'){ filt.q = ev.target.value; const el = $('#rlist'); if (el) el.innerHTML = recipeRows(filteredRecipes()); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheetStack.length){ if (rctx && rctx.big) setWake(false); popSheet(); } });

/* ---------- Inicio ---------- */
load(); curWeek = defaultWeek(); render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// Al volver a la app otro día, se sitúa en la semana que toca
let lastDay = ymd(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const today = ymd(new Date());
  if (today !== lastDay){ lastDay = today; if (!sheetStack.length){ curWeek = defaultWeek(); render(); } }
});
window.__app = { shopText, menuFor, issues, generate, shopping, buyText, nutrition, stats, defaultWeek, rotIndex, seasonFor, baseMenu, get state(){ return S; }, get week(){ return curWeek; } };
})();
</script>
</body>
</html>
